services:
  hidropuga-shiny:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hidropuga-shiny
    restart: unless-stopped

    expose:
      - "3838"

    environment:
      TZ: ${TZ}
      APP_PORT: ${APP_PORT}
      APP_URL: ${APP_URL}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      ADMIN_USER: ${ADMIN_USER}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASS: ${ADMIN_PASS}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}

      HP_FREE_ANALYSES: ${HP_FREE_ANALYSES:-}
      STRIPE_PACK_BASIC_PRICE: ${STRIPE_PACK_BASIC_PRICE:-}
      STRIPE_PACK_BASIC_UNITS: ${STRIPE_PACK_BASIC_UNITS:-}
      STRIPE_PACK_BASIC_CENTS: ${STRIPE_PACK_BASIC_CENTS:-}
      STRIPE_PACK_PROFESSIONAL_PRICE: ${STRIPE_PACK_PROFESSIONAL_PRICE:-}
      STRIPE_PACK_PROFESSIONAL_UNITS: ${STRIPE_PACK_PROFESSIONAL_UNITS:-}
      STRIPE_PACK_PROFESSIONAL_CENTS: ${STRIPE_PACK_PROFESSIONAL_CENTS:-}
      STRIPE_PACK_PREMIUM_PRICE: ${STRIPE_PACK_PREMIUM_PRICE:-}
      STRIPE_PACK_PREMIUM_UNITS: ${STRIPE_PACK_PREMIUM_UNITS:-}
      STRIPE_PACK_PREMIUM_CENTS: ${STRIPE_PACK_PREMIUM_CENTS:-}
      STRIPE_TEST_PACK_BASIC_PRICE: ${STRIPE_TEST_PACK_BASIC_PRICE:-}
      STRIPE_TEST_PACK_BASIC_UNITS: ${STRIPE_TEST_PACK_BASIC_UNITS:-}
      STRIPE_TEST_PACK_BASIC_CENTS: ${STRIPE_TEST_PACK_BASIC_CENTS:-}
      STRIPE_TEST_PACK_PROFESSIONAL_PRICE: ${STRIPE_TEST_PACK_PROFESSIONAL_PRICE:-}
      STRIPE_TEST_PACK_PROFESSIONAL_UNITS: ${STRIPE_TEST_PACK_PROFESSIONAL_UNITS:-}
      STRIPE_TEST_PACK_PROFESSIONAL_CENTS: ${STRIPE_TEST_PACK_PROFESSIONAL_CENTS:-}
      STRIPE_TEST_PACK_PREMIUM_PRICE: ${STRIPE_TEST_PACK_PREMIUM_PRICE:-}
      STRIPE_TEST_PACK_PREMIUM_UNITS: ${STRIPE_TEST_PACK_PREMIUM_UNITS:-}
      STRIPE_TEST_PACK_PREMIUM_CENTS: ${STRIPE_TEST_PACK_PREMIUM_CENTS:-}

      STRIPE_MODE: ${STRIPE_MODE:-live}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_TEST_PRICE_MONTHLY: ${STRIPE_TEST_PRICE_MONTHLY:-}
      STRIPE_TEST_PRICE_YEARLY: ${STRIPE_TEST_PRICE_YEARLY:-}
      HP_MONTHLY_QUOTA: ${HP_MONTHLY_QUOTA:-100}
      HP_YEARLY_QUOTA: ${HP_YEARLY_QUOTA:-100}
      HP_REFERRAL_PERCENT: ${HP_REFERRAL_PERCENT:-50}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY}

    volumes:
      - ${APP_DIR}:/srv/shiny-server
      - ${LOG_DIR}:/var/log/shiny-server

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3838/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
